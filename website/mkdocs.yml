# The syntax reference site. scripts/build-site.py fills ../build/site-src with website/pages, the stylesheets and
# scripts, and pages generated from the plugin's data, then builds it here into ../build/site.
site_name: Ground Marker Variables
site_description: Variables, conditions and icons for RuneLite ground marker labels
site_url: https://limy-monkey.github.io/Ground-Marker-Variables/
repo_url: https://github.com/Limy-Monkey/Ground-Marker-Variables
repo_name: Ground-Marker-Variables
edit_uri: ""
docs_dir: ../build/site-src
site_dir: ../build/site

theme:
  name: material
  # The plugin's icon.png, copied in by build-site.py.
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Variables:
      - Variables: variables.md
      - Conditions & math: conditions.md
  - Symbols: symbols.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/symbols.js
